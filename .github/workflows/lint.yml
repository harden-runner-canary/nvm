name: 'Tests: linting'

on: workflow_dispatch

jobs:
  

  dockerfile_lint:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@rc
        with:
          allowed-endpoints:
            ghcr.io:443
            github.com:443
            *.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443
      - uses: actions/checkout@v3
      - uses: ljharb/actions/node/install@8cfcaa4f61f149dce0e75a453841b9bbe0f86175
        name: 'nvm install ${{ matrix.node-version }} && npm install'
        with:
          node-version: 'lts/*'
      - run: npm run dockerfile_lint
      - name: DNS debug
        if: always()
        continue-on-error: true
        run: |
          set +e
          resolvectl status
          ls -la /etc/systemd/resolved.conf.d/ /run/systemd/resolved.conf.d/ 2>&1
          cat /etc/resolv.conf
          ss -lunp | grep ':53'
          resolvectl query github.com
          resolvectl query registry-1.docker.io
          getent hosts github.com


  doctoc:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@rc
        with:
